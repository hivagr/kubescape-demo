---
config:
  inClusterContextName: "kubescape-demo"
  pluginsDir: /build/plugins
  unsafeUseServiceAccountToken: true

initContainers:
  - command:
      - /bin/sh
      - -c
      - mkdir -p /build/plugins && cp -r /plugins/* /build/plugins/
    image: quay.io/kubescape/headlamp-plugin:latest
    name: kubescape-plugin
    volumeMounts:
      - mountPath: /build/plugins
        name: headlamp-plugins

volumeMounts:
  - mountPath: /build/plugins
    name: headlamp-plugins

volumes:
  - emptyDir: {}
    name: headlamp-plugins

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 10m
    memory: 64Mi
