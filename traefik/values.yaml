---
deployment:
  replicas: 1

# service:
#   type: NodePort
#
ports:
  web:
    nodePort: 30080
  websecure:
    nodePort: 30443

nodeSelector:
  ingress-ready: "true"

tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Equal
    effect: NoSchedule

